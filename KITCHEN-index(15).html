<style>
:root {
  --bg: #0a0a0f;
  --surface: #14141f;
  --surface-2: #1e1e2e;
  --border: #2a2a3a;
  --primary: #B87333;
  --primary-light: #D4956A;
  --success: #4ade80;
  --warning: #fb923c;
  --danger: #ef4444;
  --info: #60a5fa;
  --text: #f1f5f9;
  --text-sec: #94a3b8;
  --text-muted: #64748b;
  --radius: 12px;
  --font: 'Inter', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; overflow:hidden; }
body { font-family:var(--font); color:var(--text); background:var(--bg); -webkit-font-smoothing:antialiased; }

.kds-app { display:flex; flex-direction:column; height:100vh; }

.kds-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:0.8rem 1.5rem; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0;
}
.kds-header h1 { font-size:1.1rem; font-weight:700; color:var(--primary-light); }
.kds-header .clock { font-family:var(--font-mono); font-size:1rem; color:var(--text-sec); }
.kds-header .order-count { font-size:0.8rem; color:var(--text-muted); }

.order-card.hold { border:2px dashed #facc15; background:rgba(250,204,21,.07); }
.hold-banner { background:#facc15; color:#422006; font-weight:800; font-size:.75rem; letter-spacing:.06em; padding:.3rem .6rem; text-align:center; }
.station-tabs {
  display:flex; gap:0; overflow-x:auto; background:var(--surface);
  border-bottom:1px solid var(--border); flex-shrink:0; scrollbar-width:none;
}
.station-tabs::-webkit-scrollbar { display:none; }
.station-tab {
  padding:0.6rem 1.2rem; font-size:0.75rem; font-weight:600; white-space:nowrap;
  color:var(--text-muted); border-bottom:2px solid transparent; cursor:pointer;
  text-transform:uppercase; letter-spacing:0.05em; transition:all 0.16s var(--ease);
}
.station-tab.active { color:var(--primary-light); border-bottom-color:var(--primary); }
.station-tab .tab-count {
  display:inline-block; background:var(--danger); color:#fff; font-size:0.6rem;
  width:16px; height:16px; border-radius:50%; text-align:center; line-height:16px;
  margin-left:0.3rem;
}

.kds-content { flex:1; overflow-y:auto; padding:1rem; }

.order-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:1rem; }

.order-card {
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  overflow:hidden; transition:all 0.2s var(--ease);
}
.order-card.urgent { border-color:var(--danger); }
.order-card .card-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:0.8rem 1rem; background:var(--surface-2); border-bottom:1px solid var(--border);
}
.order-card .table-badge {
  font-family:var(--font-mono); font-size:1.2rem; font-weight:700; color:var(--primary-light);
}
.order-card .server-name { font-size:0.75rem; color:var(--text-muted); }
.order-card .timer {
  font-family:var(--font-mono); font-size:0.9rem; font-weight:600;
  padding:0.2rem 0.6rem; border-radius:6px; background:rgba(74,222,128,0.1); color:var(--success);
}
.order-card .timer.warn { background:rgba(251,146,60,0.1); color:var(--warning); }
.order-card .timer.critical { background:rgba(239,68,68,0.1); color:var(--danger); animation:blink 1s infinite; }
@keyframes blink { 50%{opacity:0.5} }

.order-card .card-items { padding:0.8rem 1rem; }
.order-item {
  display:flex; align-items:center; justify-content:space-between;
  padding:0.5rem 0; border-bottom:1px solid var(--border);
}
.order-item:last-child { border-bottom:none; }
.order-item .item-name { font-size:0.85rem; font-weight:500; }
.order-item .item-mod { font-size:0.7rem; color:var(--warning); margin-top:0.1rem; }
.order-item .item-time { font-size:0.7rem; color:var(--text-muted); font-family:var(--font-mono); }

.order-card .card-footer { padding:0.6rem 1rem; border-top:1px solid var(--border); }

/* Tasting/Prix Fixe course styling */
.order-card.tasting-course { border-color:var(--info); }
.order-card.tasting-course .card-header { background:rgba(96,165,250,0.08); }
.tasting-badge {
  display:inline-block; font-size:0.6rem; font-weight:700; text-transform:uppercase;
  letter-spacing:0.08em; padding:0.15rem 0.5rem; border-radius:4px;
  background:rgba(96,165,250,0.15); color:var(--info); margin-left:0.5rem;
}
.course-label {
  font-size:0.7rem; color:var(--info); font-weight:600; text-transform:uppercase;
  letter-spacing:0.05em; padding:0.3rem 1rem 0;
}
.pf-choices { font-size:0.7rem; color:var(--text-sec); padding:0 1rem 0.3rem; font-style:italic; }
.bump-btn {
  width:100%; padding:0.7rem; border:none; border-radius:8px;
  background:var(--success); color:var(--bg); font-size:0.85rem; font-weight:700;
  cursor:pointer; text-transform:uppercase; letter-spacing:0.05em;
  transition:all 0.12s var(--ease);
}
.bump-btn:active { transform:scale(0.96); }

/* Empty state */
.empty-state { text-align:center; padding:4rem 2rem; color:var(--text-muted); }
.empty-state .icon { font-size:3rem; margin-bottom:1rem; opacity:0.5; }

/* Login overlay */
.login-overlay {
  position:fixed; inset:0; background:var(--bg); display:flex;
  align-items:center; justify-content:center; z-index:100; text-align:center;
}
.login-overlay h1 { font-size:1.5rem; margin-bottom:0.3rem; }
.login-overlay .sub { color:var(--primary-light); font-size:0.85rem; margin-bottom:2rem; }
.login-overlay .pin-row { display:flex; gap:8px; justify-content:center; margin-bottom:1.5rem; }
.login-overlay .pin-d { width:14px; height:14px; border-radius:50%; background:var(--border); transition:all 0.16s; }
.login-overlay .pin-d.on { background:var(--primary); box-shadow:0 0 8px rgba(184,115,51,0.5); }
.login-overlay .numgrid { display:grid; grid-template-columns:repeat(3,60px); gap:10px; justify-content:center; }
.login-overlay .nbtn {
  width:60px; height:60px; border-radius:50%; border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-size:1.3rem; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:all 0.12s var(--ease);
}
.login-overlay .nbtn:active { transform:scale(0.9); background:var(--primary-glow); }
.login-overlay .nbtn.act { font-size:0.8rem; color:var(--text-sec); }
#kds-pin-error { color:var(--danger); font-size:0.8rem; margin-top:0.8rem; min-height:1.2rem; }

@media (max-width:480px) { .order-grid { grid-template-columns:1fr!important; } }

/* Named Firestore adapter for the existing database ID: default.
   It exposes the small compat-like surface used by these static apps. */
var FIRESTORE_DATABASE_ID = 'default';
var FIRESTORE_ROOT = 'https://firestore.googleapis.com/v1/projects/' + encodeURIComponent(firebaseConfig.projectId) + '/databases/' + encodeURIComponent(FIRESTORE_DATABASE_ID) + '/documents';
function createNamedFirestoreAdapter(){
  var pollers=[];
  function ensureAuth(){
    if(typeof fbAuth==='undefined' || !fbAuth) return Promise.resolve(null);
    if(fbAuth.currentUser) return Promise.resolve(fbAuth.currentUser);
    return fbAuth.signInAnonymously().then(function(result){ return result.user; });
  }
  function request(method,url,body){
    return ensureAuth().then(function(user){
      var headers={'Content-Type':'application/json'};
      var tokenPromise=user ? user.getIdToken().then(function(token){ headers.Authorization='Bearer '+token; }) : Promise.resolve();
      return tokenPromise.then(function(){
        var fullUrl=url+(url.indexOf('?')>=0?'&':'?')+'key='+encodeURIComponent(firebaseConfig.apiKey);
        return fetch(fullUrl,{method:method,headers:headers,body:body===undefined?undefined:JSON.stringify(body)}).then(function(response){
          return response.text().then(function(text){
            var json=text?JSON.parse(text):{};
            if(!response.ok){
              var error=new Error((json.error&&json.error.message)||('Firestore request failed ('+response.status+')'));
              error.code=(json.error&&json.error.status)||('http-'+response.status);
              throw error;
            }

          });

      });
    });
  }
  function encodeValue(value){
    if(value===null || value===undefined) return {nullValue:null};
    if(value instanceof Date) return {timestampValue:value.toISOString()};
    if(Array.isArray(value)) return {arrayValue:{values:value.map(encodeValue)}};
    if(typeof value==='boolean') return {booleanValue:value};
    if(typeof value==='number') return Number.isInteger(value)?{integerValue:String(value)}:{doubleValue:value};
    if(typeof value==='object') return {mapValue:{fields:encodeFields(value)}};
    return {stringValue:String(value)};
  }
  function encodeFields(object){
    var fields={};
    Object.keys(object||{}).forEach(function(key){ if(object[key]!==undefined) fields[key]=encodeValue(object[key]); });
    return fields;
  }
  function fieldMaskQuery(data){
    return Object.keys(data||{}).filter(function(k){ return data[k]!==undefined; }).map(function(k){ return 'updateMask.fieldPaths='+encodeURIComponent(k); }).join('&');
  }
  function decodeValue(value){
    if(!value) return null;
    if(Object.prototype.hasOwnProperty.call(value,'nullValue')) return null;
    if(Object.prototype.hasOwnProperty.call(value,'stringValue')) return value.stringValue;
    if(Object.prototype.hasOwnProperty.call(value,'booleanValue')) return value.booleanValue;
    if(Object.prototype.hasOwnProperty.call(value,'integerValue')) return Number(value.integerValue);
    if(Object.prototype.hasOwnProperty.call(value,'doubleValue')) return Number(value.doubleValue);
    if(Object.prototype.hasOwnProperty.call(value,'timestampValue')) return value.timestampValue;
    if(Object.prototype.hasOwnProperty.call(value,'bytesValue')) return value.bytesValue;
    if(Object.prototype.hasOwnProperty.call(value,'referenceValue')) return value.referenceValue;
    if(Object.prototype.hasOwnProperty.call(value,'geoPointValue')) return value.geoPointValue;
    if(Object.prototype.hasOwnProperty.call(value,'arrayValue')) return (value.arrayValue.values||[]).map(decodeValue);
    if(Object.prototype.hasOwnProperty.call(value,'mapValue')){
      var map={}; Object.keys(value.mapValue.fields||{}).forEach(function(key){map[key]=decodeValue(value.mapValue.fields[key]);}); return map;
    }
    return null;
  }
  function decodeFields(fields){
    var result={}; Object.keys(fields||{}).forEach(function(key){result[key]=decodeValue(fields[key]);}); return result;
  }
  function docUrl(collection,id){ return FIRESTORE_ROOT+'/'+encodeURIComponent(collection)+'/'+encodeURIComponent(id); }
  function docFrom(json,fallbackId){
    if(!json || !json.name) return {exists:false,id:fallbackId||'',data:function(){return undefined;}};
    var parts=json.name.split('/');
    return {exists:true,id:parts[parts.length-1]||fallbackId||'',data:function(){return decodeFields(json.fields||{});}};
  }
  function getDoc(collection,id){
    return request('GET',docUrl(collection,id)).then(function(json){return docFrom(json,id);}).catch(function(error){
      if(error.code==='NOT_FOUND' || error.code==='http-404') return docFrom(null,id);
      throw error;
    });
  }
  function setDoc(collection,id,data,options){
    var url=docUrl(collection,id);
    if(options && options.merge){
      var mask=fieldMaskQuery(data);
      if(mask) url+='?'+mask;
    }
    return request('PATCH',url,{fields:encodeFields(data)}).then(function(json){return docFrom(json,id);});
  }
  function updateDoc(collection,id,data){
    var mask=fieldMaskQuery(data);
    var url=docUrl(collection,id)+(mask?'?'+mask:'');
    return request('PATCH',url,{fields:encodeFields(data)}).then(function(json){return docFrom(json,id);});
  }
  function addDoc(collection,data){
    var id='web_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,10);
    return request('POST',FIRESTORE_ROOT+'/'+encodeURIComponent(collection)+'?documentId='+encodeURIComponent(id),{fields:encodeFields(data)}).then(function(json){return docFrom(json,id);});
  }
  function listDocs(collection){
    return request('GET',FIRESTORE_ROOT+'/'+encodeURIComponent(collection)+'?pageSize=1000').then(function(json){return (json.documents||[]).map(function(doc){return docFrom(doc);});});
  }
  function snapshot(docs){
    return {docs:docs,size:docs.length,empty:docs.length===0,forEach:function(callback,context){docs.forEach(function(doc){callback.call(context,doc);});}};
  }
  function watchDoc(collection,id,callback,onError){
    var stopped=false;
    function refresh(){getDoc(collection,id).then(function(doc){if(!stopped) callback(doc);}).catch(function(error){if(!stopped && onError) onError(error);});}
    refresh();
    var timer=setInterval(refresh,5000); pollers.push(timer);
    return function(){stopped=true;clearInterval(timer);};
  }
  function watchCollection(collection,filter,callback,onError){
    var stopped=false,last='';
    function refresh(){listDocs(collection).then(function(docs){
      if(filter) docs=docs.filter(function(doc){var data=doc.data()||{};return filter.op==='==' ? data[filter.field]===filter.value : true;});
      var signature=JSON.stringify(docs.map(function(doc){return {id:doc.id,data:doc.data()};}));
      if(!stopped && signature!==last){last=signature;callback(snapshot(docs));}
    }).catch(function(error){if(!stopped && onError) onError(error);});}
    refresh();
    var timer=setInterval(refresh,5000); pollers.push(timer);
    return function(){stopped=true;clearInterval(timer);};
  }
  function collection(name){
    var ref={
      doc:function(id){return {get:function(){return getDoc(name,id);},set:function(data,options){return setDoc(name,id,data,options);},update:function(data){return updateDoc(name,id,data);},onSnapshot:function(callback,onError){return watchDoc(name,id,callback,onError);}};},
      add:function(data){return addDoc(name,data);},
      onSnapshot:function(callback,onError){return watchCollection(name,null,callback,onError);},
      where:function(field,op,value){return {onSnapshot:function(callback,onError){return watchCollection(name,{field:field,op:op,value:value},callback,onError);}};}
    };
    return ref;
  }
  return {collection:collection};
}

if (typeof fbReady !== 'undefined' && fbReady) fbDb = createNamedFirestoreAdapter();

// ─── Screen mode: ?screen=kitchen (default) | bar | coffee ───────
var SCREEN = (function(){ try { var s=(new URLSearchParams(location.search).get('screen')||'kitchen').toLowerCase(); return (s==='bar'||s==='coffee')?s:'kitchen'; } catch(e){ return 'kitchen'; } })();
var SCREEN_TITLE = { kitchen:'Kitchen', bar:'Bar', coffee:'Coffee' }[SCREEN];
var KITCHEN_CODES = ['1001','5001','EPICUREAN2024']; // kitchen + manager + owner
var KITCHEN_STATIONS = ['Grill','Sauté','Fry','Cold / Garde Manger','Pastry','Expo'];
var STATE = { showCounts:(window.innerWidth>=900), orders:[], station:'All', filter:'all', view:'live', search:'', collapsed:{}, expanded:{}, armed:null };
var STALE_HOURS = 14;          // tickets with no activity this long go to Completed automatically
var HISTORY_DAYS = 7;

// ─── Small helpers ───────────────────────────────────────────────
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function pad(n){ return n<10?'0'+n:''+n; }
function clock12(ts){ if(!ts) return ''; var d=new Date(ts); var h=d.getHours(), m=d.getMinutes(); var ap=h>=12?'PM':'AM'; h=h%12||12; return h+':'+pad(m)+' '+ap; }
function ago(ts){ var m=Math.max(0,Math.floor((Date.now()-ts)/60000)); if(m<60) return m+' min'; return Math.floor(m/60)+'h '+pad(m%60)+'m'; }
function normSt(x){ return String(x||'').toLowerCase().replace(/[^a-z]/g,''); }
function isDrinkSt(st){ return /^(bar|coffee)$/i.test(String(st||'')); }
function lsGet(k,fb){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):fb; }catch(e){ return fb; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
var P = SCREEN; // storage namespace so Kitchen, Bar and Coffee never share marks
var DONE   = lsGet('kds_done_'+P, {});     // itemKey -> done timestamp
var CLOSED = lsGet('kds_closedids_'+P, {});   // order id -> time it was cleared on THIS screen (ids, not tables, so clock differences and table reuse can't hide new orders)
var HIST   = lsGet('kds_hist_'+P, []);     // finished tickets, newest first
var RECALL = lsGet('kds_recall_'+P, []);   // tickets brought back from Completed
var PRINTED= lsGet('kds_printed_'+P, {});
var AUTOPRINT = !!lsGet('kds_autoprint_'+P, false);
function saveAll(){ lsSet('kds_done_'+P,DONE); lsSet('kds_closedids_'+P,CLOSED); lsSet('kds_hist_'+P,HIST); lsSet('kds_recall_'+P,RECALL); lsSet('kds_printed_'+P,PRINTED); }

// ─── Turning raw tickets into clean lines ───────────────────────
var TEMP_RE = /\s*[·\-]\s*(Rare|Medium Rare|Medium Well|Medium|Well Done|Well)\s*$/i;
// The POS sends seat "1" plus seatPriority:true for a lady; show that as 1A everywhere.
function seatOf(i){ var s=String(i.seat==null||i.seat===''?'table':i.seat); if (/^\d+$/.test(s) && i.seatPriority) s+='A'; return s; }
function seatRank(seat){ var m=String(seat||'').match(/^(\d+)(A?)$/); if(!m) return 9999; return (m[2]?0:1000)+parseInt(m[1],10); }
function labelRank(l){
  var s=String(l||'').toLowerCase();
  if (/piccolo|welcome|amuse|bite/.test(s)) return 1;
  if (/appetizer|primi|starter|antipast/.test(s)) return 2;
  if (/main|piatti|entree|secondi/.test(s)) return 3;
  if (/pre-dessert|entremet/.test(s)) return 3.5;
  if (/dessert|dolce/.test(s)) return 4;
  return 5;
}
function labelFromCourse(n, name, station){
  n=Number(n);
  if (n===2) return 'Appetizer';
  if (n===3) return 'Main';
  if (n===4) return 'Dessert';
  if (normSt(station)==='pastry') return 'Dessert';
  return 'Kitchen';
}
function splitName(raw){
  var name=String(raw||'').trim(), mods=[];
  var t=name.match(TEMP_RE);
  if (t) { mods.push(t[1].toUpperCase()); name=name.replace(TEMP_RE,''); }
  var sz=name.match(/\s*\((appetizer size|main size|app size)\)\s*$/i);
  if (sz) { mods.push(sz[1].toUpperCase()); name=name.replace(/\s*\((appetizer size|main size|app size)\)\s*$/i,''); }
  var gf=name.match(/\s*\(GF pasta\)\s*$/i);
  if (gf) { mods.push('GLUTEN-FREE PASTA'); name=name.replace(/\s*\(GF pasta\)\s*$/i,''); }
  return { name:name.trim(), mods:mods };
}
function cleanMods(list){
  var out=[], seen={};
  (list||[]).forEach(function(m){
    String(m||'').split(' · ').forEach(function(part){
      part=part.trim();
      if (!part || /^extra plate$/i.test(part) || /^temp:/i.test(part)) return;
      var k=part.toLowerCase(); if (seen[k]) return; seen[k]=1; out.push(part);
    });
  });
  return out;
}
// Drinks: name + size only. No price, no description.
function drinkSize(mod){
  var m=String(mod||'');
  if (/taste|2\s*oz/i.test(m)) return '2 oz';
  if (/glass|6\s*oz/i.test(m)) return '6 oz';
  if (/bottle|750/i.test(m)) return 'Bottle';
  if (/half|375/i.test(m)) return 'Half';
  var c=m.replace(/^pour:\s*/i,'').replace(/\s*\$?\d+(\.\d+)?\s*$/,'').trim();
  return c;
}
function newItem(o, base){
  base.table=String(o.table); base.server=o.server||''; base.covers=o.guestCount||0;
  base.src=o.id; base.rank=labelRank(base.label);
  return base;
}
function normalize(orders){
  var items=[], notes=[], drinks=[];
  orders.slice().sort(function(a,b){ return (a.sentAt||0)-(b.sentAt||0) || String(a.id).localeCompare(String(b.id)); }).forEach(function(o){
    if (o.tastingCourse) {
      var tc=o.tastingCourse;
      if (isDrinkSt(tc.station)) return;
      var sp=splitName(tc.courseName);
      var mods=sp.mods.concat(cleanMods(tc.mods && tc.mods.length ? tc.mods : (tc.modNote?String(tc.modNote).split(' · '):[])));
      var label=tc.courseLabel || labelFromCourse(o.serviceCourse, tc.courseName, tc.station);
      items.push(newItem(o,{ seat:String(tc.position||o.position||'table'), name:sp.name, mods:mods, label:label, station:tc.station||'Expo', status:'fired', receivedAt:o.sentAt, firedAt:o.sentAt }));
      return;
    }
    if (o.isKitchenNote || o.allergyOverride) {
      (o.items||[]).forEach(function(i){
        notes.push({ table:String(o.table), seat:i.seat||'', text:[i.name&&i.name!=='NOTE'?i.name:'',i.notes||'',i.selectedMod||''].filter(Boolean).join(' — '), allergy:!!o.allergyOverride||/allerg/i.test(i.name||''), at:o.sentAt, src:o.id, station:i.station });
      });
      return;
    }
    (o.items||[]).forEach(function(i){
      if (isDrinkSt(i.station)) {
        drinks.push(newItem(o,{ seat:seatOf(i), name:splitName(i.name).name.split(/\s+[·|]\s+/)[0].replace(/\s*\$\d+(\.\d+)?\s*$/,''), size:drinkSize(i.selectedMod), mods:cleanMods([i.notes]), station:i.station, status:'fired', label:'Drinks', receivedAt:o.sentAt, firedAt:o.sentAt }));
        return;
      }
      var sp=splitName(i.name);
      var base={ seat:seatOf(i), name:sp.name, mods:sp.mods.concat(cleanMods([i.selectedMod,i.notes])), station:i.station||'Expo' };
      if (o.overview || i.preview) {
        base.label=i.courseLabel || labelFromCourse(i.course, i.name, i.station);
        base.status='hold'; base.receivedAt=o.sentAt; base.firedAt=null;
        if (i.mods && i.mods.length) base.mods=sp.mods.concat(cleanMods(i.mods));
      } else {
        base.label=i.courseLabel || labelFromCourse(i.course||i.serviceCourse, i.name, i.station);
        base.status='fired'; base.receivedAt=o.sentAt; base.firedAt=o.sentAt;
      }
      items.push(newItem(o,base));
    });
  });
  // key every line; a fired line replaces the matching on-hold preview of the same dish
  var occ={}, byKey={}, out=[];
  items.forEach(function(it){
    var k=it.table+'|'+it.seat+'|'+it.name.toLowerCase();
    var holdKey=k+'|hold', pos;
    if (it.status==='fired' && byKey[holdKey] && byKey[holdKey].length) {
      var prev=byKey[holdKey].shift();
      it.receivedAt=Math.min(prev.receivedAt||it.receivedAt, it.receivedAt);
      it.label=it.label||prev.label; it.rank=labelRank(it.label);
      out[out.indexOf(prev)]=it; it.key=prev.key; return;
    }
    occ[k]=(occ[k]||0)+1;
    it.key=k+'#'+occ[k];
    if (it.status==='hold') (byKey[holdKey]=byKey[holdKey]||[]).push(it);
    out.push(it);
  });
  out.forEach(function(it){ it.doneAt=DONE[it.key]||null; });
  var occD={};
  drinks.forEach(function(it){ var k=it.table+'|'+it.seat+'|'+it.name.toLowerCase()+'|'+it.size; occD[k]=(occD[k]||0)+1; it.key='d|'+k+'#'+occD[k]; it.doneAt=DONE[it.key]||null; });
  return { items:out, notes:notes, drinks:drinks };
}

// ─── Build tickets (one per table) ──────────────────────────────
function buildTickets(){
  var n=normalize(STATE.orders.filter(function(o){ return !CLOSED[o.id]; }));
  var pool = SCREEN==='kitchen' ? n.items : n.drinks.filter(function(d){ return normSt(d.station)===SCREEN; });
  RECALL.forEach(function(t){ t.items.forEach(function(it){ it.doneAt=DONE[it.key]||null; }); pool=pool.concat(t.items); });
  var tables={};
  pool.forEach(function(it){
    var t=tables[it.table]||(tables[it.table]={ table:it.table, server:it.server, covers:it.covers, items:[], notes:[] });
    if (!t.server) t.server=it.server; if (!t.covers) t.covers=it.covers;
    t.items.push(it);
  });
  n.notes.forEach(function(nt){
    if (SCREEN==='kitchen' ? isDrinkSt(nt.station) : normSt(nt.station)!==SCREEN) return;
    var t=tables[nt.table]; if (!t) return;
    t.notes.push(nt);
  });
  var list=Object.keys(tables).map(function(k){ return decorate(tables[k]); });
  return list;
}
function decorate(t){
  var secs={};
  t.items.forEach(function(it){
    var key=it.label||'Kitchen';
    var s=secs[key]||(secs[key]={ label:key, rank:it.rank||labelRank(key), items:[], receivedAt:null, firedAt:null, outAt:null });
    s.items.push(it);
  });
  t.sections=Object.keys(secs).map(function(k){ return secs[k]; }).sort(function(a,b){ return a.rank-b.rank; });
  var stationOnly=SCREEN==='kitchen' && STATE.station!=='All';
  t.sections.forEach(function(s){
    s.items.sort(function(a,b){ return seatRank(a.seat)-seatRank(b.seat) || a.name.localeCompare(b.name); });
    var fired=s.items.filter(function(i){ return i.status==='fired'; });
    s.receivedAt=Math.min.apply(null,s.items.map(function(i){ return i.receivedAt||Infinity; }));
    s.firedAt=fired.length?Math.min.apply(null,fired.map(function(i){ return i.firedAt||Infinity; })):null;
    s.allDone=fired.length>0 && fired.length===s.items.length && fired.every(function(i){ return i.doneAt; });
    s.state= fired.length===0 ? 'hold' : (s.allDone ? 'done' : (fired.some(function(i){ return i.doneAt; }) ? 'working' : 'fired'));
    s.outAt=s.allDone ? Math.max.apply(null,fired.map(function(i){ return i.doneAt; })) : null;
  });
  var all=t.items;
  var fired=all.filter(function(i){ return i.status==='fired'; });

    var m=String(raw||'').replace(/^\s*Position\s+\w+\s+[—-]\s*/i,'').trim();
    if (!m || /^SUB:\s*KC\b/i.test(m) || /^KC\b.*Kitchen Choice$/i.test(m)) return;
    var x;
    if ((x=m.match(/^(?:⚠\s*)?NO\s+([A-Za-z][A-Za-z \-\/]*)$/)) && /^[A-Z \-\/]+$/.test(m.replace(/^(?:⚠\s*)?NO\s+/,''))) { addA(x[1]); return; }
    if ((x=m.match(/^ALLERGY\s+([A-Za-z \-\/]+?)(?:\s+[—-]\s*(.*))?$/i))) { addA(x[1]); if (x[2]) addT(x[2].replace(/\.$/,'')); return; }
    if ((x=m.match(/^WITHOUT\s+([A-Za-z \-\/,]+?)\s+[—-]\s*CHEF TO CONFIRM/i))) { addA(x[1]); return; }
    if (/^GLUTEN-FREE PASTA$/i.test(m)) { addA('GLUTEN-FREE PASTA'); return; }
    if (/^(?:⚠\s*)?NO\s+/.test(m)) { m.split(/\s*·\s*/).forEach(function(part){ var y=part.match(/^(?:⚠\s*)?NO\s+(.+)$/); if (y) addA(y[1]); else addT(part); }); return; }

    var secs={}; h.items.forEach(function(it){ (secs[it.label||'Kitchen']=secs[it.label||'Kitchen']||[]).push(it); });
    var body=Object.keys(secs).sort(function(a,b){ return labelRank(a)-labelRank(b); }).map(function(l){
      var its=secs[l], fired=its.map(function(i){ return i.firedAt||0; }).filter(Boolean), outs=its.map(function(i){ return i.doneAt||0; }).filter(Boolean);
      var tm=(fired.length&&outs.length)?'<span class="k-times">'+clock12(Math.min.apply(null,fired))+' \u2192 '+clock12(Math.max.apply(null,outs))+' \u00B7 '+Math.max(0,Math.round((Math.max.apply(null,outs)-Math.min.apply(null,fired))/60000))+'m</span>':'';
      its.sort(function(a,b){ return seatRank(a.seat)-seatRank(b.seat) || String(a.name).localeCompare(String(b.name)); });
      return '<div class="k-sec done"><div class="k-sechead"><span class="k-seclabel">'+esc(l)+'</span>'+tm+'</div>'+groupItems(its).map(function(g){ return groupRow(g,null,null,true); }).join('')+'</div>';
    }).join('');
    var rec=h.items.length ? Math.min.apply(null,h.items.map(function(i){ return i.receivedAt||Infinity; })) : 0;
    return '<div class="k-ticket k-hticket"><div class="k-bar ready"></div><div class="k-head" style="cursor:default"><span class="k-table">'+esc(tableTitle(h.table))+'</span><span class="k-meta">'+esc(h.server||'')+'</span></div>'+
      '<div class="k-trow"><span>'+(rec&&rec!==Infinity?'in '+clock12(rec):'')+'</span><span>closed '+clock12(h.closedAt)+' \u00B7 '+new Date(h.closedAt).toLocaleDateString([], {month:'short',day:'numeric'})+(h.how==='auto'?' \u00B7 auto':'')+'</span></div>'+
      '<div class="k-tbody">'+body+'</div><div class="k-foot"><button class="k-btn ghost" onclick="recall('+HIST.indexOf(h)+')">Bring back</button></div></div>';
  }).join('');
  return '<div class="k-hist"><h3>Completed orders <small>(last '+HISTORY_DAYS+' days, kept on this screen)</small></h3>'+(cards?'<div class="k-hgrid">'+cards+'</div>':'<p class="k-empty-line">Nothing completed yet.</p>')+'</div>';
}

// ─── Actions ────────────────────────────────────────────────────
function setFilter(f){ STATE.filter=f; STATE.view='live'; render(); }
function setView(v){ STATE.view=v; render(); }
function setStation(s){ STATE.station=s; STATE.view='live'; render(); }
function setSearch(v){ STATE.search=v; render(); }
function toggleGroup(el){
  var keys; try{ keys=JSON.parse(el.getAttribute('data-keys')||'[]'); }catch(e){ return; }
  var allDone=keys.every(function(k){ return DONE[k]; });
  keys.forEach(function(k){ if (allDone) delete DONE[k]; else if (!DONE[k]) DONE[k]=Date.now(); });
  saveAll(); render();
}
function toggleExpand(k){ STATE.expanded[k]=!STATE.expanded[k]; render(); }
function toggleDone(key){
  if (DONE[key]) delete DONE[key]; else DONE[key]=Date.now();
  saveAll(); render();
}
function toggleCollapse(id){
  var t=allTickets.filter(function(x){ return x.table===id; })[0];
  var cur=STATE.collapsed[id]!==undefined?STATE.collapsed[id]:(t&&t.status==='ready');
  STATE.collapsed[id]=!cur; render();
}
function collapseAll(flag){ allTickets.forEach(function(t){ STATE.collapsed[t.table]=flag; }); render(); }
function orderForScreen(o){
  if (!o) return false;
  if (SCREEN==='kitchen') {
    if (o.tastingCourse) return !isDrinkSt(o.tastingCourse.station);
    if (o.isKitchenNote || o.allergyOverride || o.overview) return true;
    return (o.items||[]).some(function(i){ return !isDrinkSt(i.station); });
  }
  return (o.items||[]).some(function(i){ return normSt(i.station)===SCREEN; });
}
function snapshotOf(t, how){
  return { table:t.table, server:t.server, covers:t.covers, closedAt:Date.now(), how:how||'bump',
    items:t.items.map(function(i){ return { key:i.key, seat:i.seat, name:i.name, mods:i.mods, size:i.size, label:i.label, station:i.station, status:i.status, receivedAt:i.receivedAt, firedAt:i.firedAt, doneAt:i.doneAt||DONE[i.key]||null, table:i.table, server:i.server, covers:i.covers, rank:i.rank, recalled:true }; }) };
}
function pushHistory(snap){
  HIST.unshift(snap);
  var cutoff=Date.now()-HISTORY_DAYS*86400000;
  HIST=HIST.filter(function(h){ return h.closedAt>cutoff; }).slice(0,400);
}
// Clear one ticket (all of this screen's orders for that table). Only this screen's orders leave the shared feed.
function archive(t, how){
  pushHistory(snapshotOf(t,how));
  var ids=STATE.orders.filter(function(o){ return String(o.table)===String(t.table) && !CLOSED[o.id] && orderForScreen(o); }).map(function(o){ return o.id; });
  ids.forEach(function(id){ CLOSED[id]=Date.now(); });
  RECALL=RECALL.filter(function(r){ return r.table!==t.table; });
  if (SCREEN==='kitchen' && how!=='auto') ids.forEach(function(id){ removeActiveOrder(id); });
  saveAll();
}
// Very old orders (not touched for STALE_HOURS) go to Completed on their own, one order at a time; fresh orders are never touched.
function archiveStale(){
  var now=Date.now(), stale=STATE.orders.filter(function(o){ return o && !CLOSED[o.id] && orderForScreen(o) && now-(Number(o.sentAt)||0)>STALE_HOURS*3600000; });
  if (!stale.length) return false;
  var n=normalize(stale), pool=SCREEN==='kitchen'?n.items:n.drinks.filter(function(d){ return normSt(d.station)===SCREEN; }), tables={};
  pool.forEach(function(it){ var t=tables[it.table]||(tables[it.table]={table:it.table,server:it.server,covers:it.covers,items:[]}); t.items.push(it); });
  Object.keys(tables).forEach(function(k){ pushHistory(snapshotOf(tables[k],'auto')); });
  stale.forEach(function(o){ CLOSED[o.id]=now; });
  saveAll(); return true;
}
function bump(id){
  var t=allTickets.filter(function(x){ return x.table===id; })[0];
  if (!t) return;
  if (t.status!=='ready' && STATE.armed!==id) { STATE.armed=id; render(); setTimeout(function(){ if (STATE.armed===id) { STATE.armed=null; render(); } },4000); return; }
  STATE.armed=null;
  archive(t,'bump');
  STATE.orders=STATE.orders.filter(function(o){ return !(CLOSED[o.id] && SCREEN==='kitchen'); });
  render();
}
function recall(i){
  var h=HIST[i]; if (!h) return;
  HIST.splice(i,1);
  h.items.forEach(function(it){ delete DONE[it.key]; it.doneAt=null; it.recalled=true; });
  RECALL.push({ table:h.table, items:h.items });
  STATE.view='live'; saveAll(); render();
}
function removeActiveOrder(orderId) {
  if (!fbReady) return;
  var feedRef=fbDb.collection('boh_shared').doc('active_orders');
  feedRef.get().then(function(doc){
    if (!doc.exists) return;
    var data=doc.data()||{};
    var list=Array.isArray(data.list) ? data.list.filter(function(order){ return order && order.id !== orderId; }) : [];
    return feedRef.set({list:list,updatedAt:Date.now()});
  }).catch(function(error){ console.error('Active order feed update failed', error); });
}
var swipeX=null;
function bindSwipe(){
  document.querySelectorAll('.k-ticket.ready').forEach(function(el){
    el.ontouchstart=function(e){ swipeX=e.touches[0].clientX; };
    el.ontouchend=function(e){ if (swipeX==null) return; var dx=e.changedTouches[0].clientX-swipeX; swipeX=null; if (Math.abs(dx)>140) bump(el.getAttribute('data-t')); };
  });
}

// ─── Printing (home printer now; ticket printer later) ──────────
function ticketText(t, onlySection){
  var L=[]; L.push(SCREEN_TITLE.toUpperCase()+' · TABLE '+t.table+(t.server?' · '+t.server:'')+(t.covers?' · '+t.covers+' covers':''));
  L.push('Printed '+clock12(Date.now()));
  t.notes.forEach(function(n){ L.push((n.allergy?'!! ':'** ')+(n.seat?n.seat+': ':'')+n.text); });
  t.sections.forEach(function(s){
    if (onlySection && s.label!==onlySection) return;
    L.push(''); L.push(s.label.toUpperCase()+(s.firedAt?'  (fired '+clock12(s.firedAt)+')':'  (on hold)'));
    s.items.forEach(function(it){ L.push(' ['+(it.seat==='table'?'T':it.seat)+'] '+it.name+(it.size?' '+it.size:'')+(it.mods&&it.mods.length?'  -- '+it.mods.join(', '):'')); });
  });
  return L.join('\n');
}
// Runner slips: BOH (boh_shared/print_settings) says how many copies and whether ladies print first.
var PREP=lsGet('kds_prep',{});
seedKeys();
(function(){ var k=lsGet('kds_keys',{}); Object.keys(k).forEach(function(x){ KEYS[x]=k[x]; }); })();
function prepKey(n){ return String(n||'').toLowerCase().replace(/\s*\((main|appetizer|app)\s*size\)\s*$/,'').replace(/\s+[-·]\s+(rare|medium rare|medium|medium well|well done|well)\s*$/,'').replace(/[^a-z0-9]+/g,' ').trim(); }
function prepMin(n){ var v=Number(PREP[prepKey(n)]); return v>0?v:0; }
var PRINTSET=lsGet('kds_printset',{copies:1, ladiesFirst:true});
function isLadySeat(seat){ return /A$/i.test(String(seat||'')); }
var SLIP_W=36;
function wrapTxt(t,w){ var out=[], line=''; String(t).split(/\s+/).forEach(function(word){ while(word.length>w){ if(line){ out.push(line); line=''; } out.push(word.slice(0,w)); word=word.slice(w); } if(!line) line=word; else if((line+' '+word).length<=w) line+=' '+word; else { out.push(line); line=word; } }); if(line) out.push(line); return out.length?out:['']; }
// Three columns: count at the far left, dish in the middle, seats at the far right.
function slipRows(groups){
  var seatW=0; groups.forEach(function(g){ g._s=g.seats.join(', '); seatW=Math.max(seatW, Math.min(g._s.length,14)); });
  var nameW=Math.max(10, SLIP_W-3-seatW-1), lines=[];
  groups.forEach(function(g){
    var nm=wrapTxt((SCREEN==='kitchen'?dishLabel(g.name):g.name)+(g.size?' ('+g.size+')':''), nameW);
    var st=wrapTxt(g._s, Math.max(seatW,1));
    var extra=[]; var lowA=g.pm.allergies.join(' ').toLowerCase(), seenL={}; g.pm.allergies.forEach(function(a){ var l=alLabel(a); if(!seenL[l]){ seenL[l]=1; extra.push('!! '+l); } }); g.pm.texts.filter(function(t){ var m=String(t).toLowerCase().match(/^(?:no|without|sans)\s+([a-z \-]+)$/); return !(m && lowA.indexOf(m[1].trim().split(' ')[0])>=0); }).forEach(function(x){ wrapTxt(x,nameW-1).forEach(function(w){ extra.push(w); }); });
    var rows=Math.max(nm.length, st.length);
    for (var r=0;r<rows;r++) lines.push((r===0?String(g.items.length).padStart(2):'  ')+' '+(nm[r]||'').padEnd(nameW)+' '+(st[r]||'').padStart(seatW));
    extra.forEach(function(x){ lines.push('   '+x); });
  });
  return lines;
}
// One runner slip for a fired course: ladies' dishes on one piece, a cut line, then the gentlemen's below.
function runnerSlip(t, label){
  var sec=t.sections.filter(function(x){ return x.label===label; })[0]; if (!sec) return '';
  // Kitchen prints a course only once it is fired; bar and coffee print the moment the order arrives.
  var fired=sec.items.filter(function(i){ return SCREEN!=='kitchen' || i.status==='fired'; });
  if (!fired.length) return '';
  var head='TABLE '+t.table+'  '+label.toUpperCase()+'\n'+(t.server?t.server+' · ':'')+(t.covers?t.covers+' covers · ':'')+'fired '+clock12(sec.firedAt||Date.now());
  var notes=t.notes.filter(function(n){ if(!n.allergy) return true; var seat=String(n.seat||''); return !t.items.some(function(i){ return String(i.seat)===seat && parseMods(i.mods).allergies.length; }); }).map(function(n){ return (n.allergy?'!! ':'** ')+(n.seat?n.seat+': ':'')+n.text.replace(/\s+\u2014\s*can it be made without\?.*$/i,''); });
  var blocks=[];
  if (PRINTSET.ladiesFirst!==false && t.covers>=4) {
    var ladies=fired.filter(function(i){ return isLadySeat(i.seat); });
    var rest=fired.filter(function(i){ return !isLadySeat(i.seat); });
    if (ladies.length) blocks.push({title:'LADIES', items:ladies});
    if (rest.length) blocks.push({title:ladies.length?'GENTLEMEN':'', items:rest});
  } else blocks.push({title:'', items:fired});
  var CUT='\n- - - - - - - - - - - - -  CUT  - - - - - - - - - - - - -\n';
  return blocks.map(function(b,i){
    var h=head+(b.title?'  ·  '+b.title:'');
    var lines = slipRows(groupItems(b.items));
    return h+'\n'+(i===0&&notes.length?notes.join('\n')+'\n':'')+'\n'+lines.join('\n');
  }).join('\n'+CUT+'\n');
}
function slipCopies(text){
  var n=Math.max(1,Math.min(6,Number(PRINTSET.copies)||1)), out=[];
  for (var i=0;i<n;i++) out.push((n>1?'COPY '+(i+1)+' OF '+n+'\n':'')+text);
  return out;
}
function printPages(pages){
  var el=$('print-area'); el.textContent='';
  pages.forEach(function(txt){ var d=document.createElement('div'); d.className='pg'; d.textContent=txt; el.appendChild(d); });
  window.print();
}
function printText(text){ printPages([text]); }
function printTicket(id){
  var t=allTickets.filter(function(x){ return x.table===id; })[0]; if (!t) return;
  var pages=[];
  t.sections.forEach(function(sec){ var sl=runnerSlip(t,sec.label); if (sl) slipCopies(sl).forEach(function(x){ pages.push(x); }); });
  if (!pages.length) { alert('Nothing has been fired for this table yet \u2014 the slip prints when the order is fired.'); return; }
  printPages(pages);
}
function toggleAutoPrint(){ AUTOPRINT=!AUTOPRINT; lsSet('kds_autoprint_'+P,AUTOPRINT); render(); }
function maybeAutoPrint(tickets){
  if (!AUTOPRINT) { tickets.forEach(function(t){ t.items.forEach(function(i){ if (SCREEN!=='kitchen' || i.status==='fired') PRINTED[i.key]=1; }); }); lsSet('kds_printed_'+P,PRINTED); return; }
  var out=[];
  tickets.forEach(function(t){
    var fresh={};
    t.items.forEach(function(i){ if ((SCREEN!=='kitchen' || i.status==='fired') && !PRINTED[i.key]) { PRINTED[i.key]=1; fresh[i.label]=1; } });
    Object.keys(fresh).forEach(function(l){ var sl=runnerSlip(t,l); if (sl) slipCopies(sl).forEach(function(x){ out.push(x); }); });
  });
  lsSet('kds_printed_'+P,PRINTED);
  if (out.length) printPages(out);
}

// ─── Login ──────────────────────────────────────────────────────
var kdsPin='';
function buildKdsNumpad() {
  var pad=document.getElementById('kds-numpad');
  [1,2,3,4,5,6,7,8,9,'⌫',0,'→'].forEach(function(k){
    var btn=document.createElement('button');
    btn.className='nbtn'+(typeof k==='string'?' act':'');
    btn.textContent=k;
    btn.onclick=function(){ kdsKey(k); };
    pad.appendChild(btn);
  });
}
function kdsKey(k) {
  if (k==='⌫') kdsPin=kdsPin.slice(0,-1);
  else if (k==='→') kdsAttempt();
  else if (kdsPin.length<20) kdsPin+=k;
  document.querySelectorAll('#kds-pin-dots .pin-d').forEach(function(d,i){ d.classList.toggle('on',i<Math.min(kdsPin.length,4)); });
  if (kdsPin.length===4) setTimeout(kdsAttempt,200);
}
function kdsAttempt() {
  if (KITCHEN_CODES.indexOf(kdsPin)>=0) {
    document.getElementById('kds-login').style.display='none';
    document.getElementById('kds-app').style.display='flex';
    startKDS();
  } else {
    document.getElementById('kds-pin-error').textContent='Invalid code';
    kdsPin='';
    document.querySelectorAll('#kds-pin-dots .pin-d').forEach(function(d){ d.classList.remove('on'); });
  }
}

// ─── Live feed ──────────────────────────────────────────────────
function startKDS() {
  document.title=SCREEN_TITLE+' Display';
  $('kds-title').textContent=SCREEN_TITLE;
  document.body.classList.add('screen-'+SCREEN);
  render();
  if (fbReady) fbDb.collection('boh_shared').doc('prep_times').onSnapshot(function(doc){
    var d=doc.exists&&doc.data()||null; PREP=(d&&d.times)||{}; lsSet('kds_prep',PREP); if (d&&d.keys){ Object.keys(d.keys).forEach(function(k){ if(d.keys[k]) KEYS[k]=d.keys[k]; }); lsSet('kds_keys',d.keys); } render();
  }, function(){});
  if (fbReady) fbDb.collection('boh_shared').doc('print_settings').onSnapshot(function(doc){
    var d=doc.exists&&doc.data()||null; if (d){ PRINTSET={copies:Number(d.copies)||1, ladiesFirst:d.ladiesFirst!==false}; lsSet('kds_printset',PRINTSET); }
  }, function(){});
  loadOrders();
  setInterval(updateClock,1000); updateClock();
  setInterval(function(){ if (document.activeElement!==$('k-search')) render(); },30000);
}
function loadOrders() {
  if (!fbReady) { render(); return; }
  fbDb.collection('boh_shared').doc('active_orders').onSnapshot(function(doc){
    var list = doc.exists && doc.data() && Array.isArray(doc.data().list) ? doc.data().list : [];
    STATE.orders = list.filter(function(order){ return order && order.status === 'new'; });
    render();
  }, function(error){
    console.error('Active order feed read failed', error);
    STATE.orders=[]; render();
  });
}
function updateClock() {
  var now=new Date();
  $('kds-clock').textContent=clock12(now.getTime());
}

// ─── Init ───────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function(){ buildKdsNumpad(); var t=document.getElementById('kds-login-title'); if(t) t.textContent=SCREEN_TITLE+' Display'; var sb=document.getElementById('kds-login-sub'); if(sb) sb.textContent='Enter '+SCREEN_TITLE.toLowerCase()+' code'; document.title=SCREEN_TITLE+' Display'; });

</script>
